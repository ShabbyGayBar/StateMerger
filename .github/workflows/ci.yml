name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install locked development dependencies
        run: uv sync --locked --group dev

      - name: Run non-live tests with coverage
        run: uv run --locked pytest -m "not live"

      - name: Ruff check
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Build wheel and sdist
        run: uv build

      - name: Import and CLI smoke check
        run: >-
          uv run --locked python -c
          "import vic3_state_merger;
          from vic3_state_merger.cli import get_parser;
          assert get_parser().prog == 'state-merger'"

      - name: Pyright (informational)
        continue-on-error: true
        run: uv run --locked pyright src tests

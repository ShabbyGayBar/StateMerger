[build-system]
requires = ["setuptools==84.0.0", "setuptools-scm[toml]==10.2.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vic3-state-merger"
authors = [{ name = "Brian Li", email = "brianlizsy@qq.com" }]
dynamic = ["version"]
description = "Victoria 3 States Merging Automation Script & Tutorial"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pillow>=12.3.0",
    "pyradox-txt-parser>=5.0.1",
    "pyyaml>=6.0.3",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/ShabbyGayBar/StateMerger"
Issues = "https://github.com/ShabbyGayBar/StateMerger/issues"

[project.scripts]
state-merger-cli = "vic3_state_merger.cli:main"

[project.gui-scripts]
state-merger = "vic3_state_merger.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

[dependency-groups]
build = ["pyinstaller>=6.22.3"]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=vic3_state_merger",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
]
markers = [
    "unit: fast isolated tests",
    "integration: tests spanning multiple merger components",
    "smoke: lightweight import and entry-point checks",
    "live: tests requiring an installed Victoria 3 game or external data",
]

[tool.coverage.run]
branch = true
source = ["vic3_state_merger"]
omit = [
    "src/vic3_state_merger/gui.py",
    "src/vic3_state_merger/__main__.py",
    "src/vic3_state_merger/assets/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
  windows-validation:
    name: Unpublished Windows packaging validation
    needs: checks
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
  artifact-validation:
    needs: windows-validation
    uses: ./.github/workflows/validate-artifacts.yml
    with:
      ref: ${{ github.sha }}
      run_id: ${{ format('{0}', github.run_id) }}
      artifact_id: ${{ needs.windows-validation.outputs.artifact_id }}
